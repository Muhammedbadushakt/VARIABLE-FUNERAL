<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Variable Funeral — a graveyard for dead code.">
<title>Variable Funeral — Demo</title>
<link rel="stylesheet" href="media/graveyard.css">
<style>
  #demo-toast{position:fixed;right:22px;bottom:22px;z-index:200;padding:11px 15px;border:1px solid rgba(168,229,193,.3);border-radius:8px;background:rgba(5,9,13,.88);color:#dce8e2;box-shadow:0 12px 35px rgba(0,0,0,.45);backdrop-filter:blur(10px);transform:translateY(15px);opacity:0;pointer-events:none;transition:.25s ease;font-size:12px}
  #demo-toast.show{transform:none;opacity:1}
  #code-modal{position:fixed;inset:0;z-index:180;display:grid;place-items:center}
  .code-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}
  .code-card{position:relative;width:min(720px,calc(100vw - 32px));padding:25px;border:1px solid rgba(220,230,230,.16);border-radius:12px;background:rgba(7,11,15,.94);box-shadow:0 25px 80px rgba(0,0,0,.65)}
  .code-card h2{font-family:Georgia,serif;margin:4px 0 5px}
  .code-kicker{font-size:9px;letter-spacing:.18em;color:#8f9c9f}
  .code-file{font:11px monospace;color:#aeb8ba;margin-bottom:18px}
  .code-card pre{margin:0;padding:17px;overflow:auto;border-radius:8px;background:#05080b;color:#cfd7d2;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid rgba(255,255,255,.07)}
  .code-close{position:absolute;right:13px;top:10px;border:0;background:transparent;color:#aaa;font-size:25px;cursor:pointer}
  @media(max-width:720px){#demo-toast{right:12px;bottom:12px}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><div class="smoke"></div><div class="smoke s2"></div><div class="smoke s3"></div></div>
<div class="fog-layer" aria-hidden="true"><div class="fog-bank"></div><div class="fog-bank f2"></div></div>
<div id="snow" class="snow" aria-hidden="true"></div>
<div class="shell">
<header class="topbar">
<div class="title"><span class="glyph" aria-hidden="true">⚰</span><div><h1>Variable Funeral</h1><small>Dead code cemetery • enter if you dare</small></div></div>
<dl class="stats" id="stats">
<div class="stat stat-alive"><dt>Alive</dt><dd id="stat-alive">0</dd></div>
<div class="stat stat-dead"><dt>Dead</dt><dd id="stat-dead">0</dd></div>
<div class="stat stat-buried"><dt>Buried</dt><dd id="stat-buried">0</dd></div>
</dl>
</header>
<div class="toolbar">
<input id="search" type="text" placeholder="Search the graveyard by name or file…" aria-label="Search graves">
<div class="filters" id="filters" role="group" aria-label="Filter by kind">
<button class="filter-chip is-active" data-kind="all">All</button>
<button class="filter-chip" data-kind="const">Const</button>
<button class="filter-chip" data-kind="let">Let</button>
<button class="filter-chip" data-kind="var">Var</button>
<button class="filter-chip" data-kind="parameter">Params</button>
<button class="filter-chip" data-kind="import">Imports</button>
<button class="filter-chip" data-kind="function">Functions</button>
<button class="filter-chip" data-kind="class">Classes</button>
</div>
<select id="sort" aria-label="Sort graves"><option value="file">Sort: File</option><option value="name">Sort: Name</option><option value="recent">Sort: Most recent</option></select>
</div>
<main id="grid" class="grid" aria-live="polite"></main>
<section id="empty" class="empty" hidden><div class="fog"></div><p>The graveyard is empty. Run a scan to find dead code.</p></section>
<footer class="memorial"><h2>Recently buried</h2><ul id="buried-list" class="buried-list"></ul></footer>
</div>
<script src="demo.js"></script>
</body>
</html>
